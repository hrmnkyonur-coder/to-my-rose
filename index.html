<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#060208"><title>Seni Seviyorum ❤️</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060208}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,100vh);height:min(100vw,100vh);max-width:100vw;max-height:100vh}</style></head>
<body><canvas id="heart" aria-label="Seni seviyorum kalp animasyonu"></canvas><script>
(()=>{
const canvas=document.getElementById('heart'),ctx=canvas.getContext('2d');
const BG='#060208', BASE=800, SC=17.5, OY=0, DURATION=10, GAP=7, SIZES=[15,16,17,18];
const phrases=["I love you","Seni seviyorum","Te amo","Je t'aime","Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю","사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ","Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię","ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тебе кохаю"];
let side=800,dpr=1,items=[],started=performance.now(),shimmerAt=0;
function resize(){side=Math.max(240,Math.min(innerWidth,innerHeight));dpr=Math.min(devicePixelRatio||1,2);canvas.style.width=side+'px';canvas.style.height=side+'px';canvas.width=Math.round(side*dpr);canvas.height=Math.round(side*dpr);ctx.setTransform(dpr*side/BASE,0,0,dpr*side/BASE,0,0);build();started=performance.now();}
function heart(a){return [16*Math.sin(a)**3*SC,(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*SC+OY]}
function pathHeart(){ctx.beginPath();for(let i=0;i<=900;i++){const [x,y]=heart(i/900*Math.PI*2),px=BASE/2+x,py=BASE/2-y;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath()}
function inside(x,y){return ctx.isPointInPath(x,y)}
function build(){items=[];pathHeart();ctx.save();
  // Build every row from its measured left and right boundaries. Pick only
  // phrases that fit the remaining space, so the right edge isn't left ragged.
  for(let y=55;y<750;y+=20){
    const spans=[];let on=false,start=0;
    for(let x=20;x<=780;x+=1){
      const hit=inside(x,y);
      if(hit&&!on){start=x;on=true}
      else if(!hit&&on){spans.push([start,x]);on=false}
    }
    if(on)spans.push([start,780]);
    for(const [lo,hi] of spans){
      let x=lo+1;
      while(x<hi-18){
        const sz=SIZES[Math.floor(Math.random()*SIZES.length)];
        ctx.font=`bold ${sz}px Arial,sans-serif`;
        const remaining=hi-x;
        const fitting=phrases.map(text=>({text,width:ctx.measureText(text).width}))
          .filter(item=>item.width<=remaining);
        if(!fitting.length)break;
        const chosen=fitting[Math.floor(Math.random()*fitting.length)];
        const text=chosen.text,width=chosen.width,c=Math.random();
        items.push({x:x+width/2,y,text,size:sz,w:width,delay:0,
          color:c<.5?'#b20b2e':c<.8?'#e81735':'#fa5267',
          dx:(Math.random()-.5)*2,edge:Math.abs(x-lo)<3||Math.abs(x+width-hi)<3});
        x+=width+GAP;
      }
    }
  }
  ctx.restore();
  items.sort((a,b)=>(b.edge?1:0)-(a.edge?1:0));
  items.forEach((p,i)=>p.delay=i/Math.max(1,items.length)*DURATION);
}
function blend(a,b,k){const parse=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=parse(a),B=parse(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')}
function draw(now){ctx.setTransform(dpr*side/BASE,0,0,dpr*side/BASE,0,0);ctx.clearRect(0,0,BASE,BASE);const elapsed=(now-started)/1000;for(const p of items){const u=Math.max(0,Math.min(1,(elapsed-p.delay)/.65));if(u<=0)continue;const e=1-(1-u)**3,x=p.x+p.dx*(1-e),y=p.y-22*(1-e);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${p.size}px Arial,sans-serif`;ctx.fillStyle=BG;ctx.fillText(p.text,x+1.5,y+2);ctx.fillStyle=blend(BG,p.color,e);ctx.fillText(p.text,x,y);if(u<1){ctx.fillStyle=`rgba(255,199,199,${.5*Math.sin(Math.PI*u)})`;ctx.fillText(p.text,x,y)}}if(elapsed>DURATION+1){if(now-shimmerAt>150){shimmerAt=now;const p=items[Math.floor(Math.random()*items.length)];if(p)p.flash=now}for(const p of items){if(p.flash&&now-p.flash<260){ctx.globalAlpha=.7*(1-(now-p.flash)/260);ctx.fillStyle='#ffc7c7';ctx.font=`bold ${p.size}px Arial,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1}}}requestAnimationFrame(draw)}
addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(draw);
})();
</script></body></html>
